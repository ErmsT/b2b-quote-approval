# Fly.io configuration. SQLite lives on a Fly volume, so this app must run as exactly ONE machine:
# deploy with `fly deploy --ha=false`. A second machine would get its own volume and its own database.

app = "b2b-quote-approval" # app names are global on Fly.io; change this if it is taken
primary_region = "iad"     # pick the region closest to your reviewers (`fly platform regions`)

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_PATH = "/data/app.db"

[[mounts]]
  source = "quote_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Stop when idle to save cost; the first request after idle starts it again (cold start of a few seconds).
  # The volume and its data are kept while the machine is stopped.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/quotes" # exercises the server and the database
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
